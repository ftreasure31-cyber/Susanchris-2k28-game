<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060c34">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2K28 Run">
<link rel="apple-touch-icon" href="icon-180.png">
<title>SUSANCHRIS 2K28 ENDLESS RUN</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a141c;--panel:#16303a;--tile:#e9efe6;--amber:#ffb81c;--ink:#e9efe6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a141c;--ink:#e9efe6}}
:root[data-theme="dark"]{--bg:#0a141c;--ink:#e9efe6}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:600}
body{display:flex;justify-content:center}
.stage{position:relative;height:100vh;height:100dvh;width:min(100vw,56.25dvh,56.25vh);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:104px;display:flex;flex-direction:column;gap:6px;pointer-events:none;font-weight:800}
.hud b{align-self:flex-start;background:rgba(10,20,28,.72);padding:6px 12px;border-radius:8px;font-size:16px}
.pu{display:flex;flex-wrap:wrap;gap:6px}
.pu span{padding:3px 9px;border-radius:12px;font-size:13px;color:#0a141c}
.fs{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:6;width:40px;height:40px;border:0;border-radius:10px;background:rgba(10,20,28,.72);color:var(--ink);font-size:20px;cursor:pointer}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:calc(56px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(10,20,28,.85),rgba(10,20,28,0) 32%,rgba(10,20,28,0) 58%,rgba(10,20,28,.9))}
.ov.hide{display:none}
.ov h2{font-family:'Bowlby One',Impact,sans-serif;font-weight:400;margin:0 0 6px;font-size:clamp(26px,8.5vw,42px);line-height:1.05;color:#1e63ff;-webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:0 4px 0 #0a2a6b}
.ov p{margin:0 auto;max-width:34ch;font-size:15px}
.bot{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
#nm{font-family:'Bowlby One',Impact,sans-serif;font-size:30px;line-height:1.1;color:#1e63ff;-webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:0 3px 0 #0a2a6b}
.chars{display:flex;gap:5px;width:100%;overflow-x:auto;scrollbar-width:none;position:relative}
.chars button{flex:1 0 58px;max-width:72px;overflow:hidden;white-space:nowrap;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--tile);color:#1e63ff;border:2px solid transparent;border-radius:10px;padding:7px 2px;font:inherit;font-weight:900;font-size:12px;cursor:pointer}
.chars button[aria-pressed="true"]{border-color:var(--amber)}
.chars button:focus-visible,.go:focus-visible,.fs:focus-visible{outline:3px solid var(--tile);outline-offset:2px}
.sw{width:22px;height:22px;border-radius:50%;border:3px solid var(--tile)}
.go{background:#2f6fed;color:#fff;border:0;border-radius:12px;padding:14px 0;width:100%;font:inherit;font-weight:800;font-size:20px;cursor:pointer}
.hint{font-size:12px!important;opacity:.8}
.cr{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;justify-content:flex-end;gap:10px;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(10,20,28,0) 30%,rgba(10,20,28,.94) 52%)}
.cr.show{display:flex}
.cr h3{margin:0;font-family:'Bowlby One',Impact,sans-serif;font-weight:400;color:var(--amber);font-size:24px}
.cr label{font-size:12px;font-weight:800;margin-bottom:-6px}
.cr input{width:100%;padding:12px;border-radius:10px;border:2px solid var(--tile);background:var(--panel);color:var(--ink);font:inherit;font-size:18px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.opts button[aria-pressed="true"]{border-color:var(--tile);outline:2px solid var(--amber)}
.opts .tx{width:auto;border-radius:10px;padding:0 18px;background:var(--panel);color:var(--ink);font:inherit;font-weight:800}
.row{display:flex;gap:8px}
.pb{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:56px;z-index:6;width:40px;height:40px;border:0;border-radius:10px;background:rgba(10,20,28,.72);color:var(--ink);font-size:16px;cursor:pointer;display:none}
.pb:focus-visible{outline:3px solid var(--tile)}
.pz{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:rgba(10,20,28,.85)}
.pz.show{display:flex}
.pz h3{margin:0 0 8px;font-family:'Bowlby One',Impact,sans-serif;font-weight:400;font-size:36px;color:#fff}
.pz .go{max-width:280px}
.pz .alt{background:var(--panel);color:var(--ink)}
.fade{position:absolute;inset:0;z-index:8;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
.lst{display:flex;flex-direction:column;gap:8px;max-height:42dvh;overflow-y:auto}
.it{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:10px;padding:8px 10px;text-align:left;font-size:14px}
.it>div{flex:1;min-width:0}.it small{display:block;opacity:.75;font-size:12px}
.sb{background:#2f6fed;color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}
.sb[disabled]{background:#3b4a56;color:#9fb3c8;cursor:default}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:8px 2px;border:0;border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-weight:800;font-size:13px;cursor:pointer}.tabs button[aria-pressed="true"]{background:#1e63ff;color:#fff}
.bar{height:6px;border-radius:3px;background:#0a141c;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber)}
.wd{display:flex;gap:3px;flex-wrap:wrap;align-items:center}.wd span{min-width:22px;padding:2px 5px;border-radius:5px;background:rgba(10,20,28,.72);color:#9fb3c8;font-weight:800;text-align:center}.wd span.on{background:#1e63ff;color:#fff}
.ts{position:absolute;top:96px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:10;background:#1e63ff;color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;opacity:0;transition:.3s;pointer-events:none;text-align:center;max-width:90%}.ts.show{opacity:1;transform:translateX(-50%)}
.mm{display:flex;gap:8px;width:100%}
.nmr{display:flex;align-items:center;gap:10px}
.pen{width:36px;height:36px;border:0;border-radius:50%;background:var(--panel);color:var(--ink);font-size:18px;cursor:pointer}
.pen:focus-visible{outline:3px solid var(--tile)}.mm .go{flex:1;background:var(--panel);color:var(--ink);font-size:16px;padding:10px 0}
</style>
</head>
<body>
<div class="stage" id="stage">
<canvas id="c"></canvas>
<div class="hud"><b id="hud">0 m</b><div class="pu" id="pu"></div></div>
<button class="fs" id="fs" aria-label="Toggle full screen">&#x26F6;</button>
<div class="ov" id="ov">
<div><h2>SUSANCHRIS 2K28 ENDLESS RUN</h2><p id="m">Pick your runner. A teacher chases you at the start, so dodge trains, jump barriers, slide under signs and grab power-ups.</p></div>
<div class="bot">
<div class="nmr"><span id="nm"></span><button class="pen" id="pen" aria-label="Edit runner">&#9998;</button></div>
<div class="chars" id="chars"></div>
<button class="go" id="go">Run</button>
<p class="hint">Swipe left or right to change lane, up to jump, down to slide. On a keyboard use the arrow keys or WASD.</p>
</div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const CH=[
{n:'Everest',shirt:0xe4572e,hair:0x2b1a10,skin:0x8d5a3a,acc:'cap'},
{n:'Divine',shirt:0xf4f1e8,hair:0x111111,skin:0x6b4429,acc:'gold'},
{n:'Avatar',shirt:0x2f6fed,hair:0x1b1b1b,skin:0xa9744f,acc:'arrow'},
{n:'Bobzy',shirt:0x2aa198,hair:0x3a2a1a,skin:0x7a4d30,acc:'beanie'},
{n:'Goodluck',shirt:0x8e44ad,hair:0x0d0d0d,skin:0x5e3a22,acc:'band'}];
const PU={mag:{d:10,c:0xe53935,l:'Magnet'},board:{d:15,c:0x43a047,l:'Hoverboard'},shield:{d:10,c:0x00bcd4,l:'Shield'},jet:{d:15,c:0xff9800,l:'Jetpack'}};
let SV={coins:0,gems:0,of:{},own:{},bd:0,bds:[0],up:{mag:0,board:0,shield:0,jet:0},ms:[],ml:0};
try{Object.assign(SV,JSON.parse(localStorage.getItem('sc2k28-save')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sc2k28-save',JSON.stringify(SV))}catch(e){}};
const UNI=()=>({shirt:0x2f7bff,pants:0x14234f,tie:0x14234f,acc:'none'});
function rnd(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function RND(c,o){let h=7*o;for(const ch of c.n)h=(h*31+ch.charCodeAt(0))>>>0;const r=rnd(h+o*977),pk=a=>a[(r()*a.length)|0];return{shirt:pk([0xe4572e,0xffb81c,0x43a047,0x8e44ad,0xe91e8c,0x00bcd4,0xff7043,0x3949ab,0xf4f1e8,0x1b1b1b]),pants:pk([0x2a3a52,0x5a3a22,0x1b1b1b,0x4a6b3a,0x6b2c5a,0x3a3a3a]),tie:null,acc:pk(['cap','beanie','band','gold','arrow','none'])}}
function look(i){const c=CH[i],o=SV.of[c.n]||0;return Object.assign({},c,o?RND(c,o):UNI())}
const owned=(n,o)=>o===0||(SV.own[n]||[]).includes(o);
let sel=2,best=0;
try{best=+localStorage.getItem('sc2k28-best')||0}catch(e){}
const $=id=>document.getElementById(id),box=$('chars');
const hex=c=>'#'+c.toString(16).padStart(6,'0');
function pick(i){sel=i;[...box.children].forEach((x,j)=>x.setAttribute('aria-pressed',j===i));$('nm').textContent=CH[i].n;const b=box.children[i];if(b)box.scrollLeft=b.offsetLeft-box.clientWidth/2+b.offsetWidth/2;buildMenu()}
const plus=document.createElement('button');plus.innerHTML='<span class="sw" style="background:#ffb81c;color:#1a1200;display:grid;place-items:center;font-size:18px;line-height:1">+</span>New';plus.setAttribute('aria-label','Create a character');box.appendChild(plus);
function addChip(c,i){const b=document.createElement('button');b.innerHTML='<span class="sw" style="background:'+hex(c.shirt)+'"></span>';b.append(c.n);b.onclick=()=>pick(i);box.insertBefore(b,plus)}
try{const r=JSON.parse(localStorage.getItem('sc2k28-roster')||'null');if(Array.isArray(r)&&r.length>=5){CH.length=0;r.slice(0,50).forEach(c=>CH.push(c))}else JSON.parse(localStorage.getItem('sc2k28-chars')||'[]').slice(0,45).forEach(c=>CH.push(c))}catch(e){}
CH.forEach(addChip);

const stage=$('stage'),R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
const S=new THREE.Scene();S.background=new THREE.Color(0x7fc4ee);S.fog=new THREE.Fog(0xcfe9f7,40,150);
const cam=new THREE.PerspectiveCamera(66,.5625,.1,260);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);document.addEventListener('fullscreenchange',resize);resize();
S.add(new THREE.AmbientLight(0xffffff,.95));
const sun=new THREE.DirectionalLight(0xfff2d8,.95);sun.position.set(-4,10,6);S.add(sun);

const CS=1.6,LX=[-2.4,0,2.4],M=(c,e)=>new THREE.MeshLambertMaterial({color:c,emissive:e||0});
const bx=(w,h,d,c,e)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,e));
const add=(m,x,y,z,p)=>{m.position.set(x,y,z);(p||S).add(m);return m};
// track, platforms
add(bx(9,.2,260,0x2b2f33),0,-.1,-110);
[-1,1].forEach(s=>add(bx(6,1,260,0xd9e3d6),s*7.5,.4,-110));
[-3.6,-1.2,1.2,3.6].forEach(x=>add(bx(.08,.02,260,0xffb81c),x,.02,-110));
LX.forEach(x=>[-.55,.55].forEach(o=>add(bx(.12,.14,260,0x8a9399),x+o,.07,-110)));
const sleepers=[];for(let i=0;i<70;i++)sleepers.push(add(bx(8,.08,.5,0x5a4a3a),0,.03,-i*3.4+10));
// buildings
const blds=[];
function mkB(z,side){const h=6+Math.random()*22,w=4+Math.random()*4,g=new THREE.Group();
const pal=[0x9db4c4,0xe8d5b5,0xd9a79a,0xb7c9a8,0xc9b8d9,0xf0e2a0][(Math.random()*6)|0],trim=[0x5a6b7a,0x8a5a3a,0xb04a3a][(Math.random()*3)|0];add(bx(w,h,6,pal),0,h/2,0,g);
const ix=-side*(w/2+.03),tw=Math.max(1,Math.floor((h-4)/3.2));
for(let r=0;r<tw;r++)for(const zz of[-1.6,1.6]){add(bx(.08,1.3,1.1,0x7ec8e8,0x16405c),ix,3.6+r*3.2,zz,g);add(bx(.1,.14,1.5,trim),ix,2.85+r*3.2,zz,g)}
add(bx(.1,2.1,1.3,0x7a4a2a),ix,1.05,0,g);add(bx(.9,.18,2.2,trim),ix-side*.4,2.3,0,g);add(bx(w+.1,.6,6.1,trim),0,.3,0,g);
if(Math.random()<.5)add(bx(1,.15,2.4,0x777f86),ix-side*.5,6.4,0,g);
if(Math.random()<.5){const rf=new THREE.Mesh(new THREE.ConeGeometry(4.8,3,4),M(0xb5503c)),rg=new THREE.Group();rf.rotation.y=Math.PI/4;rg.add(rf);rg.scale.x=(w+.6)/6.8;add(rg,0,h+1.5,0,g);add(bx(.6,1.4,.6,0x7a6a60),w*.2,h+2,1,g)}else{add(bx(w+.4,.5,6.4,trim),0,h+.25,0,g);add(new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,1.4,10),M(0x8a5a3a)),-w*.2,h+1.2,0,g)}
add(g,side*(11+w/2+Math.random()*3),0,z);blds.push(g)}
for(let i=0;i<22;i++){mkB(-i*8+8,-1);mkB(-i*8+8,1)}
// clouds
const clouds=[],cMatW=new THREE.MeshBasicMaterial({color:0xffffff,fog:false,transparent:true,opacity:.92});
for(let i=0;i<14;i++){const g=new THREE.Group();for(let k=0;k<5;k++){const s=new THREE.Mesh(new THREE.SphereGeometry(2+Math.random()*2.5,10,8),cMatW);s.position.set(k*3-6,Math.random()*1.5,Math.random()*2);s.scale.y=.6;g.add(s)}
const side=i%2?1:-1;add(g,side*(12+Math.random()*50),28+Math.random()*20,-Math.random()*200+10);clouds.push(g)}
{const sn=new THREE.Mesh(new THREE.SphereGeometry(7,16,12),new THREE.MeshBasicMaterial({color:0xfff3a0,fog:false}));add(sn,-45,70,-170)}
// birds
const birds=[];for(let i=0;i<12;i++){const b=new THREE.Group();add(bx(.22,.14,.5,0x2b2b2b),0,0,0,b);b.userData.ws=[-1,1].map(s=>{const w=new THREE.Group();w.position.x=s*.1;add(bx(.9,.03,.3,0x2b2b2b),s*.45,0,0,w);b.add(w);return w});b.userData.ph=Math.random()*6;b.scale.setScalar(1.6);add(b,(Math.random()-.5)*80,10+Math.random()*22,-Math.random()*220+10);birds.push(b)}
// elevated railway with moving background trains
const bgT=[];
[-1,1].forEach((s,k)=>{add(bx(4,.6,260,0x555e66),s*26,6,-110);for(let p=0;p<14;p++)add(bx(.8,6,.8,0x444c53),s*26,3,-p*20+10);
const t=new THREE.Group();for(let c=0;c<3;c++){add(bx(2.6,2.6,8,[0x2aa198,0xffb81c,0xe4572e][c]),0,0,-c*8.5,t);add(bx(2.7,.8,7,0x16303a),0,.4,-c*8.5,t)}
add(t,s*26,7.9,-60-k*90);bgT.push(t)});

// realistic human figure builder (front faces -z)
function seg(len,r0,r1,c){const m=new THREE.Mesh(new THREE.CylinderGeometry(r0,r1,len,10),M(c));m.geometry.translate(0,-len/2,0);return m}
function ball(r,c,x,y,z,p){return add(new THREE.Mesh(new THREE.SphereGeometry(r,10,8),M(c)),x,y,z,p)}
function mk(c){const g=new THREE.Group(),legs=[],arms=[],knees=[],elbows=[],hands=[],fm=c.g==='f',pn=c.pants||0x2a3a52;
const tor=new THREE.Mesh(new THREE.CylinderGeometry(fm?.2:.25,fm?.16:.19,.6,14),M(c.shirt));tor.scale.z=.6;add(tor,0,1.3,0,g);
const pel=new THREE.Mesh(new THREE.CylinderGeometry(.19,.2,.18,14),M(pn));pel.scale.z=.65;add(pel,0,1,0,g);
add(new THREE.Mesh(new THREE.CylinderGeometry(.065,.075,.14,10),M(c.skin)),0,1.68,0,g);
const head=ball(.14,c.skin,0,1.84,0,g);head.scale.set(.9,1.1,1);
add(new THREE.Mesh(new THREE.SphereGeometry(.15,14,8,0,6.3,0,1.45),M(c.hair)),0,1.86,.01,g);
[-.05,.05].forEach(x=>ball(.016,0x111111,x,1.86,-.13,g));ball(.02,c.skin,0,1.82,-.14,g);[-.13,.13].forEach(x=>ball(.03,c.skin,x,1.84,0,g));
for(const s of[-1,1]){
const hip=new THREE.Group();hip.position.set(s*.11,1,0);g.add(hip);hip.add(seg(.5,.095,.075,pn));
const kn=new THREE.Group();kn.position.y=-.5;hip.add(kn);ball(.08,pn,0,0,0,kn);kn.add(seg(.46,.07,.05,pn));
const ft=new THREE.Group();ft.position.y=-.46;kn.add(ft);add(bx(.1,.06,.2,c.skin),0,-.02,-.05,ft);for(let k=0;k<5;k++)ball(.017,c.skin,-.04+k*.02,-.03,-.16,ft);
legs.push(hip);knees.push(kn);
const sh=new THREE.Group();sh.position.set(s*.3,1.53,0);g.add(sh);ball(.075,c.shirt,0,0,0,sh);sh.add(seg(.3,.06,.05,c.shirt));
const el=new THREE.Group();el.position.y=-.3;sh.add(el);ball(.05,c.skin,0,0,0,el);el.add(seg(.27,.05,.04,c.skin));
const hd=new THREE.Group();hd.position.y=-.28;el.add(hd);add(bx(.08,.08,.04,c.skin),0,-.04,0,hd);for(let k=0;k<4;k++)add(bx(.016,.07,.018,c.skin),-.03+k*.02,-.11,0,hd);add(bx(.018,.05,.018,c.skin),-s*.05,-.05,-.01,hd);
arms.push(sh);elbows.push(el);hands.push(hd)}
if(fm){add(new THREE.Mesh(new THREE.CylinderGeometry(.2,.34,.4,14),M(pn)),0,.82,0,g);add(bx(.3,.5,.1,c.hair),0,1.68,.13,g)}
const a=c.acc;
if(a==='cap'){add(new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.07,14),M(0x222222)),0,2,0,g);add(bx(.2,.03,.14,0x222222),0,1.97,-.16,g)}
if(a==='beanie')add(new THREE.Mesh(new THREE.SphereGeometry(.16,14,8,0,6.3,0,1.6),M(0xffb81c)),0,1.9,0,g);
if(a==='band')add(new THREE.Mesh(new THREE.CylinderGeometry(.155,.155,.05,14),M(0xffb81c)),0,1.95,0,g);
if(a==='gold'){const t=new THREE.Mesh(new THREE.TorusGeometry(.12,.015,6,16),M(0xffb81c));t.rotation.x=Math.PI/2;add(t,0,1.6,0,g)}
if(a==='arrow'){const k=new THREE.Mesh(new THREE.ConeGeometry(.08,.16,3),M(0xffffff));k.rotation.x=-Math.PI/2;add(k,0,1.35,-.16,g)}
if(a==='tie'){add(bx(.07,.34,.02,0xb71c1c),0,1.4,-.16,g);add(bx(.24,.04,.02,0x111111),0,1.87,-.14,g)}
if(c.tie){add(bx(.08,.52,.02,c.tie),0,1.36,-.15,g);add(bx(.1,.08,.03,c.tie),0,1.62,-.15,g)}return{g,legs,arms,knees,elbows,hands}}
// character builder (front faces -z)
function mkOld(c){const g=new THREE.Group(),legs=[],arms=[];

const MT=[['coins','Collect # coins',30],['dist','Run # meters',600],['jumps','Jump # times',15],['rolls','Roll # times',10],['pups','Grab # power-ups',3],['words','Spell # words',1],['lanes','Switch lanes # times',30]];
